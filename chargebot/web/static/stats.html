<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Juice · Stats</title>
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F0E17">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Juice">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=9">
  <style>
    .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .kpi .num { font-family: var(--font-mono); font-weight: 700; font-size: 34px; line-height: 1.1; }
    .kpi .lbl { color: var(--muted); font-size: 13px; }
    .k1 .num { color: var(--accent-text); } .k2 .num { color: var(--cyan); } .k3 .num { color: var(--pink); }
    h2 { font-size: 18px; font-weight: 800; margin: 0 0 12px; }
    .chart { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
    .yaxis { display: flex; flex-direction: column; justify-content: space-between; height: 160px; padding-top: 34px; font-size: 11px; color: var(--muted); text-align: right; font-family: var(--font-mono); }
    .yaxis span { line-height: 1; transform: translateY(-50%); }
    .yaxis span:last-child { transform: none; }
    .plot { position: relative; height: 160px; padding-top: 18px; border-bottom: 1.5px solid var(--line-soft); }
    .plot .grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-soft); }
    .plot .g1 { top: 34px; } .plot .g2 { top: calc(34px + (100% - 34px) / 2); }
    .bars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 100%; }
    .bars .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 4px; }
    .bars .col:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
    .bars .col.on { background: var(--card-2); }
    .bars .v { font-family: var(--font-mono); font-size: 10px; line-height: 1; color: var(--muted); text-align: center; height: 14px; margin-bottom: 2px; overflow: visible; white-space: nowrap; }
    .bars .col.on .v { color: var(--text); font-weight: 700; }
    .bars .b { display: block; border-radius: 4px 4px 1px 1px; background: var(--lime); border: var(--border-w) solid var(--line); border-bottom: 0; }
    .bars .b.zero { border: 0; }
    .bars .b.peak { background: var(--pink); }
    .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 6px 0 0 28px; }
    .readout { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 1.5em; }
    .readout b { color: var(--text); }
    .heat { display: grid; grid-template-columns: 38px repeat(16, minmax(0, 1fr)); gap: 3px; font-size: 11px; color: var(--muted); }
    .heat .c { aspect-ratio: 1.4; border-radius: 4px; background: var(--cyan); }
    .heat .h { text-align: center; }
    .legend { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 10px; }
    .legend i { width: 16px; height: 10px; border-radius: 3px; background: var(--cyan); display: inline-block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><span class="bolt" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M13 2 5 13h5.5l-1 9L18 10.5h-5.5z" fill="currentColor"/></svg></span><span>Juice<span class="dot">.</span></span></a>
      <nav class="nav" aria-label="Pages">
        <a href="/">Now</a>
        <a href="/stats" aria-current="page">Stats</a>
        <a href="/guide">Guide</a>
        <button type="button" class="btn primary install" id="installBtn" hidden>⬇ Install app</button>
        <span class="seg" id="themeSeg" role="group" aria-label="Theme"></span>
      </nav>
    </header>
    <main id="main" class="stack"><p class="muted">Crunching the numbers…</p></main>
    <footer class="foot">Totals only. Personal stats are in ChargeBot's Home tab in Slack.</footer>
  </div>
  <script src="/static/app.js?v=9"></script>
  <script src="/static/stats.js?v=9"></script>
</body>
</html>
