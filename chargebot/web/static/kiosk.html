<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Juice · Kiosk</title>
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F0E17">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Juice">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=10">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .kiosk { height: 100vh; padding: 3vh 3vw; display: grid; grid-template-rows: auto 1fr; gap: 2.5vh; transition: transform 2s ease; }
    .ktop { display: flex; justify-content: space-between; align-items: center; }
    .ktop .brand { font-size: clamp(22px, 2.4vw, 40px); }
    .kbody { display: grid; grid-template-columns: 1.55fr 1fr; gap: 2.5vw; min-height: 0; }
    .kmain { display: flex; flex-direction: column; justify-content: center; gap: 2vh; min-width: 0; }
    .kside { display: flex; flex-direction: column; justify-content: center; gap: 2.5vh; min-width: 0; }
    .kname { font-size: clamp(28px, 3.6vw, 64px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ktime { font-family: var(--font-mono); font-weight: 700; font-size: clamp(64px, 11vw, 200px); line-height: .95; color: var(--accent-text); }
    .ktime.pink { color: var(--pink); }
    .kiosk .battery { height: clamp(48px, 8vh, 96px); border-width: 4px; border-radius: 22px; }
    .kiosk .chip { font-size: clamp(12px, 1.1vw, 18px); padding: .4em 1em; }
    .kcard { padding: clamp(16px, 2vw, 32px); }
    .kcard .label { color: var(--muted); font-size: clamp(13px, 1.1vw, 18px); }
    .kcard .val { font-size: clamp(20px, 2.2vw, 36px); font-weight: 800; }
    .kgrid { display: grid; gap: 2vw; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .kgrid .ktime { font-size: clamp(48px, 6vw, 110px); }
    .qr { width: clamp(80px, 9vw, 150px); aspect-ratio: 1; background: #fff; border-radius: 12px; padding: 8px; flex: 0 0 auto; }
    .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
    .kbtn { font-size: clamp(18px, 1.8vw, 30px); padding: .6em 1.2em; }
    @media (max-width: 800px) { html, body { overflow: auto; } .kiosk { height: auto; } .kbody { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="kiosk" id="kiosk">
    <header class="ktop">
      <span class="brand"><span class="bolt" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M13 2 5 13h5.5l-1 9L18 10.5h-5.5z" fill="currentColor"/></svg></span><span>Juice<span class="dot">.</span></span></span>
      <span class="live" id="live"><i></i>Connecting…</span>
    </header>
    <div class="kbody">
      <main class="kmain" id="kmain" aria-live="polite"></main>
      <aside class="kside" id="kside"></aside>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/static/app.js?v=10"></script>
  <script src="/static/kiosk.js?v=10"></script>
</body>
</html>
